[package]
name = "worker-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }  # The Async Engine
redis = { version = "0.24", features = ["tokio-comp"] } # Redis Driver
serde = { version = "1", features = ["derive"] } # JSON parsing
serde_json = "1"
dotenv = "0.15" # Config loader
